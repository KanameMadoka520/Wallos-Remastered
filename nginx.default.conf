server {
    listen [::]:80 ipv6only=off;
    server_name your_domain_or_ip; # Change to your domain or IP

    root /var/www/html; # Change to your web root directory

    set $wallos_static_cache_control "public, max-age=300, must-revalidate";
    if ($args ~ "^v=[A-Za-z0-9._-]+$") {
        set $wallos_static_cache_control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location = /service-worker.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    }

    location = /manifest.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    }

    location ~* ^/(?:styles|scripts|webfonts)/.*\.(?:css|js|mjs|woff2?|ttf|otf)$ {
        try_files $uri =404;
        add_header Cache-Control $wallos_static_cache_control always;
        gzip on;
        gzip_comp_level 6;
        gzip_min_length 1024;
        gzip_vary on;
        gzip_types text/css application/javascript text/javascript image/svg+xml;
    }

    location ~* ^/images/(?:icon|siteicons|siteimages|avatars|screenshots|uploads/icons)/.*\.(?:avif|gif|ico|jpe?g|png|svg|webp)$ {
        try_files $uri =404;
        add_header Cache-Control $wallos_static_cache_control always;
        gzip on;
        gzip_vary on;
        gzip_types image/svg+xml;
    }

    location ^~ /images/uploads/logos/subscription-media/ {
        deny all;
        return 403;
    }

    location ^~ /images/uploads/logos/.wallos.restore. {
        deny all;
        return 403;
    }

    location ^~ /images/uploads/.wallos.restore. {
        deny all;
        return 403;
    }

    location /images/uploads/logos/ {
        if (-e /var/www/html/.tmp/database-maintenance.lock) {
            return 503;
        }
        if (-e /var/www/html/db/.wallos-restore-transaction) {
            return 503;
        }
        try_files $uri =404;
    }

    location ~* ^/images/uploads/logos/.*\.php(?:/|$) {
        deny all;
        return 403;
    }

    location ^~ /backups/ {
        deny all;
        return 403;
    }

    location ^~ /db/ {
        deny all;
        return 403;
    }

    location ^~ /.tmp/ {
        deny all;
        return 403;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php-fpm.sock; # Adjust the path if necessary
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header Cache-Control;
        fastcgi_hide_header Pragma;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # Additional configuration if needed
}
