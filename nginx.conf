user  nginx;
worker_processes  2;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    client_max_body_size 256m;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Only exact build fingerprints are immutable. Unexpected or missing query
    # strings stay short-lived so a deployment can never pin an old asset.
    map $args $wallos_static_cache_control {
        default                         "public, max-age=300, must-revalidate";
        ~^v=[A-Za-z0-9._-]+$           "public, max-age=31536000, immutable";
    }

    server {
        listen       [::]:80 ipv6only=off;
        server_name  localhost;

        location / {
            root   /var/www/html;
            index  index.php;
        }

        location = /service-worker.js {
            root /var/www/html;
            try_files $uri =404;
            add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        }

        location = /manifest.json {
            root /var/www/html;
            try_files $uri =404;
            add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        }

        location ~* ^/(?:styles|scripts|webfonts)/.*\.(?:css|js|mjs|woff2?|ttf|otf)$ {
            root /var/www/html;
            try_files $uri =404;
            add_header Cache-Control $wallos_static_cache_control always;
            gzip on;
            gzip_comp_level 6;
            gzip_min_length 1024;
            gzip_vary on;
            gzip_types text/css application/javascript text/javascript image/svg+xml;
        }

        location ~* ^/images/(?:icon|siteicons|siteimages|avatars|screenshots|uploads/icons)/.*\.(?:avif|gif|ico|jpe?g|png|svg|webp)$ {
            root /var/www/html;
            try_files $uri =404;
            add_header Cache-Control $wallos_static_cache_control always;
            gzip on;
            gzip_vary on;
            gzip_types image/svg+xml;
        }

        location ^~ /images/uploads/logos/subscription-media/ {
            deny all;
            return 403;
        }

        location ^~ /images/uploads/logos/.wallos.restore. {
            deny all;
            return 403;
        }

        location ^~ /images/uploads/.wallos.restore. {
            deny all;
            return 403;
        }

        location /images/uploads/logos/ {
            root /var/www/html;
            if (-e /var/www/html/.tmp/database-maintenance.lock) {
                return 503;
            }
            if (-e /var/www/html/db/.wallos-restore-transaction) {
                return 503;
            }
            try_files $uri =404;
        }

        location ~* ^/images/uploads/logos/.*\.php(?:/|$) {
            deny all;
            return 403;
        }

        location ^~ /backups/ {
            deny all;
            return 403;
        }

        location ^~ /db/ {
            deny all;
            return 403;
        }

        location ^~ /.tmp/ {
            deny all;
            return 403;
        }

        location ~ \.php$ {
            root           /var/www/html;
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include        fastcgi_params;
            fastcgi_hide_header Cache-Control;
            fastcgi_hide_header Pragma;
            add_header Cache-Control "private, no-store, max-age=0" always;
            add_header Pragma "no-cache" always;
        }

    }

    include /etc/nginx/conf.d/*.conf;
}
